# MySQL 8 本地开发（可选）。启动后执行 sql/init.sql，再启动后端。
services:
  mysql:
    image: mysql:8.0
    container_name: print-ims-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: print_ims
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
